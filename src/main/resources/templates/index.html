<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>사주 금융 공학 - 운명의 흐름</title>
  <!-- 폰트: 신비로운 느낌의 Cinzel과 Noto Serif KR -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+KR:wght@300;600&display=swap" rel="stylesheet">
  <!-- Lottie Player 라이브러리 -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <style>
    /* [1. 신비로운 테마 설정] */
    :root {
      --bg-deep: #0f0c29;
      --bg-mid: #302b63;
      --bg-light: #24243e;
      --gold: #ffd700;
      --text-silver: #e0e0e0;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Serif KR', serif;
      background: linear-gradient(135deg, var(--bg-deep), var(--bg-mid), var(--bg-light));
      color: var(--text-silver);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .container {
      width: 90%;
      max-width: 600px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    /* [2. 타이포그래피] */
    h1 {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .subtitle {
      font-size: 1rem;
      opacity: 0.8;
      margin-bottom: 40px;
    }

    /* [3. 입력 폼 스타일] */
    .input-group {
      margin-bottom: 25px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      transition: 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    }

    /* [4. 버튼 스타일] */
    .btn-magic {
      background: linear-gradient(45deg, #1e1e2f, #4a4a6a);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 15px 40px;
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      cursor: pointer;
      border-radius: 50px;
      transition: all 0.5s ease;
      position: relative;
      overflow: hidden;
      margin-top: 20px;
    }

    .btn-magic:hover {
      background: var(--gold);
      color: var(--bg-deep);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      transform: translateY(-3px);
    }

    /* [5. 애니메이션 및 화면 전환] */
    .hidden {
      display: none !important;
      opacity: 0;
    }

    .fade-in {
      animation: fadeIn 1.5s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 로딩 화면 */
    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .loading-text {
      margin-top: 20px;
      font-family: 'Cinzel', serif;
      color: var(--gold);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    /* 결과 화면 카드 */
    .result-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 215, 0, 0.2);
      padding: 30px;
      border-radius: 15px;
      text-align: left;
      line-height: 1.8;
      white-space: pre-wrap; /* 줄바꿈 보존 */
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* 결과 텍스트 강조 */
    .result-content strong {
      color: var(--gold);
      font-weight: 700;
    }

    /* 배경 별 효과 */
    .stars {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(white 1px, transparent 1px);
      background-size: 50px 50px;
      opacity: 0.1;
      z-index: 0;
      pointer-events: none;
    }

    /* Lottie 플레이어 강제 스타일링 (깨짐 방지) */
    lottie-player {
      width: 300px !important;
      height: 300px !important;
      margin: 0 auto; /* 중앙 정렬 */
      display: block;
      /* SVG 내부 변형 방지 */
      transform: translate3d(0,0,0);
    }
    /* 로딩 화면 컨테이너 정렬 보정 */
    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px; /* 최소 높이 확보 */
    }

  </style>
</head>
<body>

<!-- 배경 효과 -->
<div class="stars"></div>

<div class="container">

  <!-- 1. 입력 화면 -->
  <div id="input-screen">
    <h1>Destiny Sector</h1>
    <p class="subtitle">당신의 사주에 숨겨진 부의 기운을 찾으세요</p>

    <form id="sajuForm">
      <div class="input-group">
        <label for="birthDate">생년월일 (YYYY-MM-DD)</label>
        <input type="date" id="birthDate" required>
      </div>

      <div class="input-group">
        <label for="birthTime">태어난 시간 (선택)</label>
        <input type="time" id="birthTime">
      </div>

      <button type="submit" class="btn-magic">운명 분석하기</button>
    </form>
  </div>

    <!-- 2. 로딩 화면 (Lottie Animation 수정됨) -->
    <div id="loading-screen" class="hidden">
        <!-- 깨짐 방지를 위해 renderer="svg"와 명시적 크기 지정 -->
        <lottie-player
                src="https://lottie.host/5f5d8869-268e-4f30-8025-05e810578631/B3f8S5X3z2.json"
                background="transparent"
                speed="1"
                style="width: 300px; height: 300px;"
                loop
                autoplay
                renderer="svg">
        </lottie-player>
        <p class="loading-text">천지의 기운을 읽고 있습니다...</p>
    </div>

  <!-- 3. 결과 화면 -->
  <div id="result-screen" class="hidden">
    <h1>운명 분석 결과</h1>
    <div class="result-card fade-in">
      <div id="result-content" class="result-content"></div>
    </div>
    <button onclick="location.reload()" class="btn-magic" style="margin-top: 30px;">다시 분석하기</button>
  </div>

</div>

<script>
  document.getElementById('sajuForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    // 1. 화면 전환: 입력창 숨기기 -> 로딩창 보이기
    const inputScreen = document.getElementById('input-screen');
    const loadingScreen = document.getElementById('loading-screen');
    const resultScreen = document.getElementById('result-screen');
    const resultContent = document.getElementById('result-content');

    inputScreen.classList.add('hidden');
    loadingScreen.classList.remove('hidden');

    // 2. 데이터 준비
    const birthDate = document.getElementById('birthDate').value;
    const birthTime = document.getElementById('birthTime').value || "00:00";

    try {
      // 3. API 호출
      const response = await fetch('/api/saju-stock/analyze', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ birthDate, birthTime })
      });

      const data = await response.json();

      // 4. 응답 처리 및 텍스트 포맷팅 (강조 처리)
      // AI 응답의 대괄호 [] 부분을 골드 컬러로 강조
      let formattedText = data.result;
      formattedText = formattedText.replace(/\[(.*?)\]/g, '<br><br><strong>[$1]</strong>');

      // 5. 화면 전환: 로딩창 숨기기 -> 결과창 보이기
      // 약간의 지연을 주어 로딩 애니메이션을 최소 2초간 감상하게 함 (UX)
      setTimeout(() => {
        loadingScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        resultContent.innerHTML = formattedText;
      }, 2000);

    } catch (error) {
      console.error('Error:', error);
      alert("천지의 기운이 혼탁하여 연결이 끊어졌습니다. 잠시 후 다시 시도해주세요.");
      location.reload();
    }
  });
</script>
</body>
</html>
