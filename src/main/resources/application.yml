spring:
  ai:
    openai:
      api-key: ${GEMINI_API_KEY}  # Google AI Studio
      base-url: https://generativelanguage.googleapis.com
      chat:
        options:
          model: gemini-3-flash-preview
          temperature: 0.7
        completions-path: /v1beta/openai/chat/completions
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/ai-db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: myuser
    password: mypassword
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
